plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
//    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "$mod_id-$minecraft_version"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
//            jvmArgs "-Dpaco.debug.base_shader_dump=true"
            // Fixed heap so the collector stops resizing under churn (added 2026-08-06 while
            // chasing the once-a-second GC stutter). ZGC A/B test 2026-08-07: fully concurrent,
            // sub-millisecond pauses; this dev JVM is Oracle JDK 17, which ships ZGC but NOT
            // Shenandoah. G1 baseline was: '-XX:MaxGCPauseMillis=20' instead of UseZGC
            // (measured 81 pauses/2min, 14.6ms avg, P99 33.5ms).
            // MaxDirectMemorySize added 2026-09-05: two JVM aborts that day ("insufficient memory
            // for the Java Runtime Environment", native malloc failures) with the heap at 1.6G of
            // 6G. Flight recorder showed the off-heap direct-buffer pool swinging 4MB <-> 2GB every
            // ~10s (Distant Horizons LOD loading; Netty falls back to cleaner-managed direct
            // buffers here too) and it is only released by GC. Uncapped it defaults to Xmx, so the
            // process could commit 6G heap + 6G direct before a GC ran; the cap makes the JDK force
            // a collection at 2G instead of letting the machine run out of commit.
            jvmArgs '-Xms6G', '-Xmx6G', '-XX:+UseZGC', '-XX:MaxDirectMemorySize=2G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven {
        url = "https://maven.valkyrienskies.org"
        content {
            includeGroupByRegex "org\\.valkyrienskies.*"
        }
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
        content {
            includeGroup "thedarkcolour"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    flatDir { dirs project.file('libs') }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // IMPLEMENTATION
    implementation fg.deobf("curse.maven:embeddium-908741:5681725")
//    compileOnly fg.deobf("curse.maven:embeddium-908741:5681725")
//    runtimeOnly fg.deobf("curse.maven:rubidium-574856:4952685")

    // COMPILE ONLY
    implementation fg.deobf("curse.maven:oculus-581495:6020952")
    compileOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    // DhApi 7.0.0 — matches DH 3.x (DH 3.1.2-b reports API major 7)
    compileOnly fg.deobf("maven.modrinth:distanthorizonsapi:GgrzKRsK")

    // Nvidium 0.2.6-beta (Fabric jar, compile-time only — users run it through Sinytra
    // Connector; Acedium, the NeoForge port, has no 1.20.1 build to depend on instead).
    // Raw jar, not fg.deobf: we only reference Nvidium's own (unobfuscated) classes in the
    // mixin target, and its Sodium references resolve against Embeddium's identical package
    // names. NEVER make this runtime — the Connector dev-runtime experiment crashed at boot.
    compileOnly("maven.modrinth:nvidium:J2fuM58R") {
        transitive = false
    }

    // Valkyrien Skies 2 (optional at runtime; detected via ModList).
    // Raw jar, not fg.deobf: we only reference VS's own (unobfuscated) API classes, and
    // deobfing would drag VS's optional-integration transitives through ForgeGradle.
    compileOnly("org.valkyrienskies:valkyrienskies-120-forge:2.4.9") {
        transitive = false
    }
    compileOnly "org.valkyrienskies.core:api:+"

    // RUNTIME ONLY
    compileOnly fg.deobf("curse.maven:cloth-config-348521:5729105")
    compileOnly fg.deobf("curse.maven:immersive-portals-for-forge-355440:6368524")

    // DH 3.1.2-b for 1.20.1 (API major 7); older curse 508933:7375280 was API 5 and nonfunctional in dev
    // Swap in FWGxbEM3 (DH 3.2.0-b, also API 7) to dev-test the 3.2 textured-LOD contract
    compileOnly fg.deobf("maven.modrinth:distanthorizons:4HFx4xGx")

    runtimeOnly fg.deobf("curse.maven:flerovium-1142875:7584065")
    runtimeOnly fg.deobf("curse.maven:asyncparticles-1215753:8551952")
    runtimeOnly fg.deobf("curse.maven:true-darkness-forge-updated-fork-970641:5080314")
    runtimeOnly fg.deobf("curse.maven:starlight-with-create-fix-1438426:7501699")
    runtimeOnly fg.deobf("curse.maven:wakes-reforged-1223529:7494279")
    runtimeOnly fg.deobf("curse.maven:lively-lighting-1485353:8382791")
    //runtimeOnly fg.deobf("curse.maven:dynamiclights-reforged-551736:6044481")
    compileOnly fg.deobf("curse.maven:oculus-581495:6020952")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    runtimeOnly fg.deobf("curse.maven:cubes-without-borders-975120:5855464")
    runtimeOnly fg.deobf("curse.maven:free-cam-557076:4643128")
    runtimeOnly fg.deobf("curse.maven:spark-361579:4738952")
    //runtimeOnly fg.deobf("curse.maven:vanillin-965702:6446560")
    //runtimeOnly fg.deobf("curse.maven:supplementaries-412082:7884611")
    //runtimeOnly fg.deobf("curse.maven:selene-499980:7945711")

    //runtimeOnly fg.deobf("curse.maven:subtle-effects-1023913:8008318")
    //runtimeOnly fg.deobf("curse.maven:fzzy-config-1005914:7568893")
    //runtimeOnly fg.deobf("curse.maven:pretty-rain-1163800:6411988")
    // Kotlin for Forge: required by fzzy-config (Pretty Rain's config lib)
    //runtimeOnly fg.deobf("thedarkcolour:kotlinforforge:4.11.0")

    // Create (dev environment)
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // Ponder (required by Create dev setup)
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    // Flywheel
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:[1.0.5,)")
    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:[1.0.5,)")

    // Registrate (required by Create internally)
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly "curse.maven:euphoria-patches-915902:8177591"

//    // oculus flywheel compatilayers
//    compileOnly fg.deobf("curse.maven:iris-flywheel-compat-659897:6694861")
//    implementation fg.deobf("curse.maven:colorwheel-1254143:8206638")
//
//    implementation fg.deobf("org.andrew:paco:1.0")
//    implementation fg.deobf("a:pc:1.0")
//    implementation fg.deobf("a:acedium:1.0")
//    implementation fg.deobf("curse.maven:swampier-swamps-632591:4578599")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            mod_icon               : mod_icon,
            mod_home_page          : mod_home_page
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

mixin {
    add sourceSets.main, 'colorful_lighting.refmap.json'
    config 'colorful_lighting.mixins.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// Thin API artifact: just the net.camacraft.colorfullighting.api package (classes + sources) for
// mods that want a compile-time-only dependency. Most consumers can instead depend on the full
// jar from CurseMaven/Modrinth with fg.deobf; see docs/API.md.
tasks.register('apiJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'net/camacraft/colorfullighting/api/**'
    }
    from(sourceSets.main.allJava) {
        include 'net/camacraft/colorfullighting/api/**'
    }
}
tasks.named('assemble').configure { dependsOn 'apiJar' }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact tasks.named('apiJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
